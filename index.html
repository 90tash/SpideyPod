<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Peter's iPod — Spider-Man Playlist</title>
    <meta
      name="description"
      content="Nostalgic early 2000s indie, punk, and alt-rock bangers from Peter Parker's iPod playlist. Plug in and swing through Queens."
    />
    <meta name="theme-color" content="#b11313" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Peter's iPod" />
    <meta property="og:title" content="Peter's iPod — Spider-Man Playlist" />
    <meta
      property="og:description"
      content="Indie rock, punk, and alt-rock bangers from Peter Parker's iPod playlist."
    />
    <meta property="og:url" content="https://peter-parker-ipod.vercel.app" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css?v=28" />
  </head>

  <body>
    <!-- Shutter Flash Overlay -->
    <div id="flash-overlay" class="flash-overlay" aria-hidden="true"></div>

    <!-- Ambient background with cross-fading layers -->
    <div class="bg" aria-hidden="true">
      <div class="bg__layer bg__layer--1"></div>
      <div class="bg__scrim"></div>
    </div>

    <!-- Hidden YouTube iframe — sound source -->
    <div class="yt-host" aria-hidden="true">
      <div id="yt-player"></div>
    </div>

    <!-- Top Bar -->
    <header class="topbar">
      <div class="clock" id="clock" aria-label="Current time">12:00 pm</div>

      <div class="presence" aria-live="polite">
        <span class="presence__dot" aria-hidden="true"></span>
        <span class="presence__count" id="listeners">1</span>
        <span class="presence__label">swinging in Queens</span>
      </div>

      <nav class="links" aria-label="Listen elsewhere">
        <a
          class="link"
          id="link-spotify"
          href="https://open.spotify.com/playlist/4RK2HtW4xBcfxpQ6ULV26A?si=721da681fd1541df"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open playlist on Spotify"
          title="Open playlist on Spotify"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.485 17.301c-.217.355-.68.472-1.035.256-2.868-1.752-6.478-2.149-10.73-1.176-.406.094-.814-.162-.907-.568-.094-.406.162-.814.568-.907 4.647-1.062 8.624-.613 11.848 1.356.355.217.472.68.256 1.039zm1.464-3.262c-.274.444-.858.588-1.302.314-3.284-2.019-8.293-2.607-12.177-1.428-.499.151-1.025-.132-1.176-.631-.151-.499.132-1.025.631-1.176 4.437-1.347 9.948-.696 13.71 1.621.444.274.588.858.314 1.302zm.126-3.41c-3.937-2.338-10.439-2.554-14.218-1.406-.604.183-1.246-.157-1.429-.762-.183-.604.157-1.246.762-1.429 4.339-1.317 11.517-1.059 16.012 1.611.543.322.721 1.025.399 1.568-.322.543-1.025.721-1.568.399z"/>
          </svg>
        </a>
        <a
          class="link"
          id="link-ytm"
          href="https://music.youtube.com/playlist?list=PLvYr5oSUk8FZ0cMjF98d0wzxkPwocmAPV"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open playlist on YouTube Music"
          title="Open playlist on YouTube Music"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/>
          </svg>
        </a>
      </nav>
    </header>

    <!-- Side Actions Panel (Daily Bugle Camera shutter) -->
    <aside class="side-actions">
      <button class="action-btn" id="shutter-btn" type="button" aria-label="Take Daily Bugle Photo">
        <span class="action-btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </span>
        <span class="action-btn__text">
          <span class="action-btn__title">Daily Bugle</span>
          <span class="action-btn__sub">Snap Photo</span>
        </span>
      </button>

      <button class="action-btn" id="web-btn" type="button" aria-label="Shoot Web">
        <span class="action-btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2v20M2 12h20M12 12l7.07 7.07M12 12L4.93 4.93M12 12l7.07-7.07M12 12L4.93 19.07"/>
            <path d="M12 8a4 4 0 0 1 4 4M12 6a6 6 0 0 1 6 6M12 4a8 8 0 0 1 8 8"/>
          </svg>
        </span>
        <span class="action-btn__text">
          <span class="action-btn__title">Web Shooter</span>
          <span class="action-btn__sub">Thwip!</span>
        </span>
      </button>
    </aside>

    <!-- Main Section -->
    <main>
      <!-- Stylized Tape Label Title -->
      <h1 class="logo">
        <span class="logo__label">Peter's iPod</span>
      </h1>

      <!-- Player Dock -->
      <div class="dock">
        <!-- Playlist panel, overlaps the disc -->
        <section class="list" id="list" aria-label="Playlist">
          <ol id="listItems"></ol>
        </section>



        <!-- Doodled quote bumper -->
        <p class="bumper">
          <span class="bumper__text" id="bumperText">With great power comes great responsibility...</span>
          <button class="bumper__next" id="bumperNext" type="button" aria-label="Next quote">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11.5A8 8 0 106.3 17.7" />
              <path d="M20 5.5v6h-6" />
            </svg>
          </button>
        </p>

        <!-- Main Player Card -->
        <section class="player" id="player" aria-label="Player">
          <!-- Spinning Vinyl Disc with artwork -->
          <div class="disc" id="disc">
            <div class="disc__ring">
              <img id="cover" class="disc__art" alt="" src="" />
            </div>
            <span class="disc__hub" aria-hidden="true"></span>
          </div>

          <!-- Metadata & Seek Bar -->
          <div class="meta">
            <p class="meta__title" id="title">Loading playlist...</p>
            <p class="meta__artist" id="artist">&nbsp;</p>

            <div
              class="seek"
              id="seek"
              role="slider"
              tabindex="0"
              aria-label="Seek"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="seek__rail"><div class="seek__fill" id="seekFill"></div></div>
              <div class="seek__knob" id="seekKnob"></div>
            </div>
            <div class="time"><span id="tCur">0:00</span> / <span id="tDur">0:00</span></div>
          </div>

          <!-- Playback Controls -->
          <div class="controls">
            <button id="shuffle" type="button" class="btn btn--toggle is-on" aria-label="Shuffle" aria-pressed="true">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
                <path d="M17 3l4 4-4 4V8h-2.2l-2.3 3.1 2.3 3.1H17V11l4 4-4 4v-3h-3.2l-2.6-3.5L8.6 15H3v-2h4.6l2.6-3.5L12.8 6H17V3zM3 9h3.4l1.5 2H3V9z"/>
              </svg>
            </button>
            <button id="prev" type="button" class="btn" aria-label="Previous track">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
              </svg>
            </button>
            <button id="play" type="button" class="btn btn--play" aria-label="Play">
              <svg class="i-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z" />
              </svg>
              <svg class="i-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
              </svg>
            </button>
            <button id="next" type="button" class="btn" aria-label="Next track">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path d="M16 6h2v12h-2zm-2 6L5.5 6v12z" />
              </svg>
            </button>
            <button id="listBtn" type="button" class="btn btn--toggle" aria-label="Playlist" aria-expanded="false" aria-controls="list">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
                <path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-6.5l4 3-4 3z" />
              </svg>
            </button>
          </div>
        </section>
      </div>
    </main>



    <noscript>
      <p style="color: #fff; text-align: center; padding: 2rem">
        JavaScript is required to play songs using the YouTube player.
      </p>
    </noscript>

    <script src="app.js?v=26"></script>

    <!-- Debug Console Overlay -->
    <div id="debug-console-container" style="display: none; position: fixed; bottom: 80px; left: var(--edge); right: var(--edge); background: rgba(15, 15, 20, 0.95); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px; font-family: monospace; font-size: 0.8rem; z-index: 10000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-height: 200px; overflow-y: auto;">
      <div style="font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
        <span>SpideyPod Debug Console (Press 'D' to show/hide)</span>
        <button onclick="document.getElementById('debug-console-container').style.display='none'" style="background:none; border:none; color:#fff; cursor:pointer; font-weight:bold; font-size: 1rem;">×</button>
      </div>
      <div id="debug-console" style="white-space: pre-wrap; word-break: break-all;"></div>
    </div>
  </body>
</html>
